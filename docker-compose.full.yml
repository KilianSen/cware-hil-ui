# Full stack on a SINGLE port: an nginx proxy fronts both the hub
# (cware-hil-mcp) and this UI, so /, /mcp, /bridge and /health all live on
# http://localhost:22360.
#
#   export CC_HITL_TOKEN=$(openssl rand -hex 24)
#   docker compose -f docker-compose.full.yml up -d --build
#
# Open http://localhost:22360 and paste CC_HITL_TOKEN in the top bar — host/port
# default to this origin (localhost:22360), so the dashboard connects with no
# other config. Agents connect at http://localhost:22360/mcp.

services:
  hub:
    # Built straight from the hub repo. Pin a release with "...#v0.2.1" if you want.
    build: https://github.com/KilianSen/cware-hil-mcp.git
    image: cware-hil-mcp
    environment:
      CC_HITL_TOKEN: "${CC_HITL_TOKEN:?set CC_HITL_TOKEN in your shell or a .env file}"
      CC_HITL_HOST: "0.0.0.0"
      CC_HITL_PORT: "22360"
    expose:
      - "22360" # internal only — reached through the proxy
    volumes:
      - hub-data:/data
    restart: unless-stopped

  ui:
    build: .
    image: cware-hil-ui
    expose:
      - "80" # internal only — reached through the proxy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # The one published port. Restrict to "127.0.0.1:22360:80" for local-only use.
      - "22360:80"
    depends_on:
      - ui
      - hub
    restart: unless-stopped

volumes:
  hub-data:

# Security: everything is published on one port; the hub's bearer token is the
# only thing guarding /mcp and /bridge once this is reachable off localhost. Use a
# strong CC_HITL_TOKEN and a TLS reverse proxy in front before exposing it beyond a
# trusted network. Serving over https here means the bridge is same-origin wss, so
# no mixed-content problem.
