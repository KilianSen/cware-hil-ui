# Full stack on a SINGLE port, deployable straight into Portainer (or any
# `docker compose up`): pulls the prebuilt hub + UI images — no build, no bind
# mounts. The UI image reverse-proxies the hub paths, so everything is on one
# port: /  -> UI, and /mcp /bridge /health -> hub.
#
#   In Portainer: add CC_HITL_TOKEN as a stack environment variable, then deploy.
#   Locally:      CC_HITL_TOKEN=$(openssl rand -hex 24) docker compose -f docker-compose.full.yml up -d
#
# Open http://<host>:22360 — host/port default to this origin and the token field
# is pre-filled from CC_HITL_TOKEN (passed to the UI too), so the dashboard
# connects with no manual config. Agents connect at http://<host>:22360/mcp.
#
# NOTE: both images must be public on GHCR (or add registry credentials in
# Portainer) for the pull to succeed.

services:
  hub:
    image: ghcr.io/kiliansen/cware-hil-mcp:latest
    environment:
      CC_HITL_TOKEN: "${CC_HITL_TOKEN:?set CC_HITL_TOKEN (a stack env var in Portainer)}"
      # Leave the hub on 22360 — the UI image proxies to hub:22360.
      CC_HITL_HOST: "0.0.0.0"
      CC_HITL_PORT: "22360"
    expose:
      - "22360" # internal only — reached through the UI's proxy
    volumes:
      - hub-data:/data
    restart: unless-stopped

  ui:
    image: ghcr.io/kiliansen/cware-hil-ui:latest
    environment:
      # Same token as the hub — lets the UI auto-populate the token field. The UI
      # serves it at GET /runtime-config.js, so anyone who can load the page can
      # read it: only set this on trusted / TLS-fronted deployments. Omit (or set
      # empty) to require pasting the token by hand, as before.
      CC_HITL_TOKEN: "${CC_HITL_TOKEN:-}"
    ports:
      # The one published port. Restrict to "127.0.0.1:22360:80" for local-only use.
      - "22360:80"
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-data:

# Security: everything is on one port and the hub's bearer token is the only
# thing guarding /mcp and /bridge once this is reachable off localhost. Use a
# strong CC_HITL_TOKEN and put TLS in front before exposing beyond a trusted
# network — over https the bridge is same-origin wss, so no mixed-content issue.
