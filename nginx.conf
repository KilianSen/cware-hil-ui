# The UI image serves the static SPA AND can reverse-proxy the hub paths, so a
# full deployment needs only this image + the hub image on one port (see
# docker-compose.full.yml). In a UI-only deployment the /mcp, /bridge and
# /health locations are simply unused.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving the `hub` name through a variable (below)
  # makes nginx look it up lazily at request time, so this image still starts
  # when there is no `hub` on the network (UI-only deployments).
  resolver 127.0.0.11 ipv6=off valid=30s;

  # MCP Streamable HTTP (POST calls + GET SSE stream). No buffering so events
  # flush immediately; long timeouts because the ask tools block until answered.
  location /mcp {
    set $hub hub:22360;
    proxy_pass http://$hub$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Bridge WebSocket.
  location /bridge {
    set $hub hub:22360;
    proxy_pass http://$hub$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location /health {
    set $hub hub:22360;
    proxy_pass http://$hub$request_uri;
    proxy_set_header Host $host;
  }

  # Long-cache the fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Runtime config is regenerated per deployment from CC_HITL_TOKEN — never cache.
  location = /runtime-config.js {
    add_header Cache-Control "no-store";
  }

  # SPA fallback so deep links / refreshes work.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
