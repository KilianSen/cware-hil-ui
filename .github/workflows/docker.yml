name: docker

# Build the UI image and push it to GHCR on every push to main. The image's
# semver tag is derived from commit messages (Conventional Commits):
#   fix: -> patch, feat: -> minor, feat!: / "BREAKING CHANGE" -> major.
# A non-conventional commit still ships, bumping the patch (default_bump below).

on:
  push:
    branches: [main]

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create & push the version tag
  packages: write # push the image to ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag computation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tag.outputs.new_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.new_version }}
            type=semver,pattern={{major}},value=${{ steps.tag.outputs.new_version }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.new_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
