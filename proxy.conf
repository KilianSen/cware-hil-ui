# Reverse proxy putting the UI and the hub on one port:
#   /mcp, /bridge, /health  -> hub      (MCP Streamable HTTP + bridge WebSocket)
#   everything else          -> ui       (the static SPA)
# Used by docker-compose.full.yml.

map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name _;

  # MCP Streamable HTTP: POST for calls, GET for the SSE stream. Disable
  # buffering so events flush immediately, and use long timeouts because the
  # ask tools block until a human answers.
  location /mcp {
    proxy_pass http://hub:22360;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  # Bridge WebSocket (the human UI <-> hub channel).
  location /bridge {
    proxy_pass http://hub:22360;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }

  location /health {
    proxy_pass http://hub:22360;
    proxy_set_header Host $host;
  }

  # The UI static bundle (its own nginx handles SPA fallback).
  location / {
    proxy_pass http://ui:80;
    proxy_set_header Host $host;
  }
}
